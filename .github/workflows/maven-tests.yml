name: Maven tests

on:
  push:
    branches:
      - feature/t4e7a6b-automated-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JUnit 5 and MockMvc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven test suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test
