spring.application.name=baiojt2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}

# Thymeleaf
spring.thymeleaf.encoding=UTF-8

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Never expose internal exception details in browser error responses
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Remember-me signing key; set SECURITY_REMEMBER_ME_KEY to a long random secret outside local development.
security.remember-me.key=${SECURITY_REMEMBER_ME_KEY:local-dev-remember-me-key-change-before-deploying}
