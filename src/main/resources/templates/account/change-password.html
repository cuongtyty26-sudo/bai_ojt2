<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Đổi mật khẩu', ~{::content})}">
<body><section th:fragment="content" class="container py-5" style="max-width:640px">
    <h1 class="h3 mb-4">Đổi mật khẩu</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/account/password}" th:object="${changePasswordForm}" method="post" class="card card-body shadow-sm">
        <div class="mb-3"><label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
            <input id="currentPassword" type="password" th:field="*{currentPassword}" class="form-control" autocomplete="current-password">
            <small class="text-danger" th:errors="*{currentPassword}"></small></div>
        <div class="mb-3"><label class="form-label" for="newPassword">Mật khẩu mới</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" class="form-control" autocomplete="new-password">
            <small class="text-danger" th:errors="*{newPassword}"></small></div>
        <div class="mb-3"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password">
            <small class="text-danger" th:errors="*{confirmPassword}"></small></div>
        <button class="btn btn-primary" type="submit">Cập nhật mật khẩu</button>
    </form>
</section></body></html>
