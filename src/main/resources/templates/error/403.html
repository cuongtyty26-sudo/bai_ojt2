<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 - Không có quyền truy cập | OJT Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width: 560px;">
        <p class="display-1 fw-bold text-warning mb-0">403</p>
        <h1 class="h3 mb-3">Bạn không có quyền truy cập</h1>
        <p class="text-secondary" th:text="${errorMessage}">Bạn không có quyền truy cập chức năng này.</p>
        <div class="d-flex justify-content-center gap-2">
            <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
            <button class="btn btn-outline-secondary" type="button" onclick="history.back()">Quay lại</button>
        </div>
    </section>
</main>
</body>
</html>
