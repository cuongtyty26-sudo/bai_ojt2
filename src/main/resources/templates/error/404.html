<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Không tìm thấy trang | OJT Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card border-0 shadow-sm text-center p-4 p-md-5" style="max-width: 560px;">
        <p class="display-1 fw-bold text-primary mb-0">404</p>
        <h1 class="h3 mb-3">Không tìm thấy trang</h1>
        <p class="text-secondary" th:text="${errorMessage} ?: 'Đường dẫn có thể đã thay đổi hoặc không tồn tại.'">Đường dẫn có thể đã thay đổi hoặc không tồn tại.</p>
        <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
    </section>
</main>
</body>
</html>
