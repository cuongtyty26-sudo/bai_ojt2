<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Quên mật khẩu', ~{::content})}">
<body><section th:fragment="content" class="container py-5" style="max-width:520px">
    <h1 class="h3 mb-3">Quên mật khẩu</h1>
    <p class="text-secondary">Nhập email tài khoản. Mã OTP có hiệu lực trong 10 phút.</p>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="card card-body shadow-sm">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" th:field="*{email}" class="form-control mb-1" required>
        <small class="text-danger mb-3" th:errors="*{email}"></small>
        <button class="btn btn-primary" type="submit">Tạo mã OTP</button>
    </form>
    <p class="mt-3"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</section></body></html>
