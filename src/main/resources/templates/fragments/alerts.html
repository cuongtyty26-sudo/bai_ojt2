<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="alerts" aria-live="polite" aria-atomic="true">
<div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert"><span th:text="${successMessage}">Thao tác thành công.</span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
<div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert"><span th:text="${errorMessage}">Đã xảy ra lỗi.</span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
<div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">Email hoặc mật khẩu không chính xác.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
<div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">Bạn đã đăng xuất thành công.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button></div>
</section></body></html>
