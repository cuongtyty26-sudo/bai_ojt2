<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản | OJT Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card border-0 shadow-sm w-100 p-4 p-md-5" style="max-width: 540px;">
        <a class="text-decoration-none text-center mb-3" th:href="@{/}">
            <span class="h3 fw-bold text-dark"><span class="text-primary">OJT</span> Connect</span>
        </a>
        <h1 class="h4 text-center mb-2">Tạo tài khoản sinh viên</h1>
        <p class="text-secondary text-center mb-4">Điền thông tin để bắt đầu sử dụng OJT Connect.</p>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>
            <div class="mb-3">
                <label for="fullName" class="form-label">Họ và tên</label>
                <input id="fullName" type="text" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''"
                       class="form-control" autocomplete="name" maxlength="150" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">Lỗi họ tên</div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"
                       class="form-control" autocomplete="email" maxlength="255" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Lỗi email</div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input id="password" type="password" th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid' : ''"
                       class="form-control" autocomplete="new-password" minlength="8" maxlength="72" required>
                <div class="form-text">Tối thiểu 8 ký tự.</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">Lỗi mật khẩu</div>
            </div>
            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid' : ''"
                       class="form-control" autocomplete="new-password" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">Mật khẩu nhập lại không khớp</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
        </form>
        <p class="text-center text-secondary small mt-4 mb-0">
            Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none">Đăng nhập</a>
        </p>
    </section>
</main>
</body>
</html>
