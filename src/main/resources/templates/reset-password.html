<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Đặt lại mật khẩu', ~{::content})}">
<body><section th:fragment="content" class="container py-5" style="max-width:560px">
    <h1 class="h3 mb-3">Xác minh OTP và đặt lại mật khẩu</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p></div>
    <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" class="card card-body shadow-sm">
        <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" type="email" th:field="*{email}" class="form-control" required></div>
        <div class="mb-3"><label for="otp" class="form-label">Mã OTP 6 chữ số</label><input id="otp" type="text" inputmode="numeric" maxlength="6" th:field="*{otp}" class="form-control" required><small class="text-danger" th:errors="*{otp}"></small></div>
        <div class="mb-3"><label for="newPassword" class="form-label">Mật khẩu mới</label><input id="newPassword" type="password" th:field="*{newPassword}" class="form-control" autocomplete="new-password"><small class="text-danger" th:errors="*{newPassword}"></small></div>
        <div class="mb-3"><label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password"><small class="text-danger" th:errors="*{confirmPassword}"></small></div>
        <button class="btn btn-primary" type="submit">Đặt lại mật khẩu</button>
    </form>
    <p class="mt-3"><a th:href="@{/forgot-password}">Yêu cầu mã OTP mới</a></p>
</section></body></html>
