spring.datasource.url=jdbc:h2:mem:baiojt2_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Use Hibernate-generated test schema. Production Flyway scripts include MySQL-specific DDL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
